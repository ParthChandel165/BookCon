name: Run Jest Tests

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master, development ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  test:
    name: Run Unit Tests
    runs-on: windows-latest
    
    env:
      NODE_ENV: test
      JWT_SECRET: test_secret_key
      JWT_EXPIRES: 7d
      ACTIVATION_SECRET: test_activation_secret
      SMPT_HOST: smtp.example.com
      SMPT_PORT: 587
      SMPT_PASSWORD: test_password
      SMPT_MAIL: test@example.com
      STRIPE_API_KEY: test_stripe_key
      STRIPE_SECRET_KEY: test_stripe_secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: |
          npm ci
          npm install -g jest

      - name: Debug information
        run: |
          node -v
          npm -v
          npm list --depth=0

      - name: Run tests
        run: npx jest --forceExit --detectOpenHandles --runInBand --verbose