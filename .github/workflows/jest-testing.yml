name: Automated Test Suite

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
            --health-cmd "bash -c 'echo > /dev/tcp/localhost/27017'"
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5

    timeout-minutes: 10
    env:
      NODE_ENV: test
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      MONGO_URI: mongodb://mongo:27017/testdb
      STRIPE_KEY: ${{ secrets.STRIPE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Node.js 20 Setup
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      # Install backend dependencies
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      # Install frontend dependencies
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
    

      # Run backend tests
      - name: Run Backend Test Suite
        working-directory: backend
        run: npm test -- --coverage --detectOpenHandles

      # Run frontend tests (optional, remove if you don't want)
     # - name: Run Frontend Test Suite
      #  working-directory: frontend
       # run: npm test -- --coverage --detectOpenHandles

      # Upload backend coverage report (if needed)
      - name: Upload Backend Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage

      # Upload frontend coverage report (if needed)
      #- name: Upload Frontend Coverage
       # if: always()
        #uses: actions/upload-artifact@v4
        #with:
         # name: frontend-coverage-report
          #path: frontend/coverage
