name: Debug Jest Tests

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master, development ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  test:
    name: Debug Unit Tests
    runs-on: windows-latest
    
    env:
      NODE_ENV: test
      JWT_SECRET: test_secret_key
      JWT_EXPIRES: 7d
      ACTIVATION_SECRET: test_activation_secret
      SMPT_HOST: smtp.example.com
      SMPT_PORT: 587
      SMPT_PASSWORD: test_password
      SMPT_MAIL: test@example.com
      STRIPE_API_KEY: test_stripe_key
      STRIPE_SECRET_KEY: test_stripe_secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: List repository contents
        run: dir

      - name: Install dependencies
        run: |
          npm ci
          npm install -g jest

      - name: Show package.json content
        run: type package.json

      - name: Show jest config
        run: type jest.config.js

      - name: Debug environment
        run: |
          node -v
          npm -v
          npm list --depth=0
          echo "Working directory:"
          cd
          echo "Test files:"
          dir /s *test.js

      # Run individual test files one by one to identify which one is failing
      - name: Run auth test
        continue-on-error: true  # Continue even if this test fails
        run: npx jest middleware/auth.test.js --verbose

      - name: Run product test
        continue-on-error: true  # Continue even if this test fails
        run: npx jest controller/product.test.js --verbose

      - name: Run order test
        continue-on-error: true  # Continue even if this test fails
        run: npx jest controller/order.test.js --verbose

      - name: Run user test
        continue-on-error: true  # Continue even if this test fails
        run: npx jest model/user.test.js --verbose