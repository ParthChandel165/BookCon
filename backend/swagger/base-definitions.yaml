components:
    schemas:
        Error:
            type: object
            properties:
                success:
                    type: boolean
                    example: false
                message:
                    type: string
                    example: "Error message details"

        Success:
            type: object
            properties:
                success:
                    type: boolean
                    example: true
                message:
                    type: string
                    example: "Operation successful"
